name: Supply chain policy checks
on:
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require min-release-age when package.json exists
        run: |
          if [[ -f package.json ]]; then
            if [[ ! -f .npmrc ]]; then
              echo "::error::No .npmrc found at repo root. Create one containing: min-release-age=7"
              exit 1
            fi
            if ! grep -qE '^\s*min-release-age\s*=\s*([7-9]|[1-9][0-9]+)\s*$' .npmrc; then
              echo "::error::.npmrc must set min-release-age to at least 7 (days). Add this line: min-release-age=7"
              exit 1
            fi
          fi

  trufflehog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --results=verified,unknown
